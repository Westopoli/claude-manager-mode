spec_dir = "specs/"
briefs_dir = ".swarm/briefs/"
questions_dir = ".swarm/questions/"
answers_dir = ".swarm/answers/"
proposals_dir = ".swarm/proposals/"
type_contract_path = "src/contract.py"

umbrella_test_cmd = "python3 -m pytest tests/ -v"
apex_test_cmd = ""
graphify_cmd = ""

snapshot_ignore = [
  ".git/**", ".swarm/**", "__pycache__/**",
  "node_modules/**", ".venv/**", "*.pyc",
]

parent_owned = [
  "src/contract.py",
  "specs/**",
]

[invariants]
max_impl_lines = 200
max_test_assertions = 20

ambiguous_verbs = [
  "decide", "choose", "design", "determine",
  "figure out", "resolve", "as appropriate",
  "use your judgment", "pick", "select an approach",
]

[gates]
extra_spec_gate_cmds = []
